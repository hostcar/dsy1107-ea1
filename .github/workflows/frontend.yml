# =============================================================================
# DSY1107 · EA1 — CI del front Angular: build, pruebas y publicación en
# Amplify. El backend tiene su propio workflow (backend.yml).
#
# El alcance es la APLICACIÓN, no la infraestructura. Terraform queda fuera a
# propósito: terraform.tfstate guarda en claro la contraseña del usuario demo
# de Cognito, así que no se versiona y el pipeline no puede leerlo. La infra se
# aplica en local con ./deploy.sh, y sus datos llegan aquí como variables de
# repositorio (./sincronizar-github.sh las carga de una vez).
#
# El reparto entre variables y secretos es el mismo punto que enseña 1.2.4: el
# client_id de una SPA es público —viaja en claro en cada /authorize— así que
# va como variable. Lo único secreto son las credenciales de AWS.
#
#   Variables:  AWS_REGION · AMPLIFY_APP_ID · AMPLIFY_BRANCH (opcional)
#               COGNITO_DOMAIN · COGNITO_CLIENT_ID · REDIRECT_URI · API_URL
#   Secretos:   AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY · AWS_SESSION_TOKEN
#
# Las credenciales del Learner Lab caducan al cerrar el lab: hay que refrescar
# los tres secretos en cada sesión.
# =============================================================================

name: CI · Front

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

# Dos despliegues simultaneos sobre la misma rama de Amplify se pisan: gana el
# ultimo en llegar, que no siempre es el ultimo commit.
concurrency:
  group: front-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AMPLIFY_APP_ID: dsy1107-frontend
  AMPLIFY_BRANCH: main
  REDIRECT_URI: https://main.d36l5ygvcqeske.amplifyapp.com


jobs:
  # ===========================================================================
  # FRONT · Angular. En pull request compila y prueba; publica solo en main.
  # ===========================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUTA_BUILD: frontend/dist/frontend/browser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Credenciales de AWS
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publicar en Amplify
        if: github.event_name != 'pull_request'
        # El empaquetado, la subida y el sondeo del job viven en scripts/,
        # compartidos con el despliegue local. El script también valida el
        # directorio antes de publicarlo (index.html y config.json presentes).
        run: |
          scripts/publicar-amplify.sh "$AMPLIFY_APP_ID" "$AMPLIFY_BRANCH" "$RUTA_BUILD"
          echo "### Front publicado en ${REDIRECT_URI%/}" >> "$GITHUB_STEP_SUMMARY"
