name: Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend_deploy.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUTA_BUILD: frontend/dist/frontend/browser

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ConfigService lee este archivo en runtime, antes del primer render. No
      # se versiona: cada despliegue lo genera con los valores de la cuenta
      # actual, que salen de "terraform output".
      - name: Generar config.json
        env:
          REGION: ${{ vars.AWS_REGION }}
          COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          REDIRECT_URI: ${{ vars.REDIRECT_URI }}
          API_URL: ${{ vars.API_URL }}
        run: |
          set -euo pipefail

          faltan=()
          for v in REGION COGNITO_DOMAIN CLIENT_ID REDIRECT_URI API_URL; do
            [[ -n "${!v:-}" ]] || faltan+=("$v")
          done
          if [[ ${#faltan[@]} -gt 0 ]]; then
            echo "Faltan variables del repositorio: ${faltan[*]}" >&2
            exit 1
          fi

          # Con el redirectUri de localhost el build compila igual y la app solo
          # falla en el navegador, con un redirect_mismatch que no menciona este
          # paso. Es el fallo numero uno del despliegue en Amplify.
          if [[ "$REDIRECT_URI" != https://* ]]; then
            echo "REDIRECT_URI vale '$REDIRECT_URI'; debe ser la URL de Amplify, no localhost." >&2
            exit 1
          fi

          jq -n \
            --arg region        "$REGION" \
            --arg cognitoDomain "$COGNITO_DOMAIN" \
            --arg clientId      "$CLIENT_ID" \
            --arg redirectUri   "$REDIRECT_URI" \
            --arg apiUrl        "$API_URL" \
            '{region:$region, cognitoDomain:$cognitoDomain, clientId:$clientId, redirectUri:$redirectUri, apiUrl:$apiUrl}' \
            > frontend/public/config.json

          echo "config.json generado (redirectUri: $REDIRECT_URI)"

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Credenciales de AWS
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publicar en Amplify
        if: github.event_name != 'pull_request'
        env:
          APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          RAMA: ${{ vars.AMPLIFY_BRANCH || 'main' }}
          DESTINO: ${{ vars.REDIRECT_URI }}
        run: |
          [ -n "$APP_ID" ] || { echo "::error::Falta la variable AMPLIFY_APP_ID. Ejecuta ./sincronizar-github.sh"; exit 1; }
          scripts/publicar-amplify.sh "$APP_ID" "$RAMA" "$RUTA_BUILD"
          echo "### Front publicado en ${DESTINO%/}" >> "$GITHUB_STEP_SUMMARY"
