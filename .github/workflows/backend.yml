# =============================================================================
# DSY1107 · EA1 — CI/CD del backend Spring Boot.
#
# Este workflow arrastraba una deuda desde que se creo: compilaba el jar y lo
# guardaba como artefacto, pero no publicaba en ninguna parte porque el destino
# estaba sin decidir. Ya esta decidido —ECS Fargate— y el paso de despliegue es
# el segundo job.
#
# El despliegue NO reimplementa nada: llama a scripts/publicar-fargate.sh, el
# mismo que se usa en local. Una sola definicion del procedimiento; si cambia el
# como se publica, cambia en un archivo y los dos lados lo heredan.
#
# -----------------------------------------------------------------------------
# CREDENCIALES: la parte fragil, y hay que decirla
#
# Lo correcto seria OIDC (sin secretos de larga vida), pero eso exige crear un
# proveedor de identidad y un rol IAM, y el Learner Lab no permite crear roles.
# Asi que se usan las credenciales temporales del lab como secretos:
#
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_SESSION_TOKEN
#
# CADUCAN CON LA SESION DEL LAB (unas horas), y el error NO dice "caducado".
# Al cerrarse el lab, AWS Academy adjunta una politica de deny explicito
# (voc-cancel-cred) y cualquier llamada responde:
#
#   AccessDeniedException: ... is not authorized to perform: <accion>
#   ... with an explicit deny in an identity-based policy
#
# Eso se lee como un problema de permisos y se pierde media hora revisando IAM.
# No lo es: significa que el lab se cerro. Se reabre, se copian las tres
# credenciales de nuevo, y listo. Es el mismo credenciales-lab.env de siempre,
# ahora tambien en GitHub.
#
# Comprobacion rapida para distinguirlo de un permiso mal puesto: si
# "aws sts get-caller-identity" funciona pero cualquier otra llamada da deny
# explicito, es el lab, no tu politica.
#
# Los nombres de recursos van como VARIABLES del repositorio, no como secretos:
# no son secretos, y verlos en el log ayuda a diagnosticar.
#
#   vars.AWS_REGION  vars.ECR_REPO  vars.ECS_CLUSTER
#   vars.ECS_SERVICE vars.API_ID    vars.INTEGRATION_ID
#
# Salen todos de "terraform output".
# =============================================================================

name: CI · Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/publicar-fargate.sh'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/publicar-fargate.sh'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Compilar y probar. Corre siempre, tambien en pull requests: es la red que
  # impide que llegue a main algo que no compila.
  # ---------------------------------------------------------------------------
  construir:
    name: Build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # java.version del pom es 21 (debe coincidir con la imagen base del
      # Dockerfile y con el runtime_platform de fargate.tf). Si ahi cambia,
      # cambia aqui.
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build y pruebas
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Guardar el jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/backend.jar
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Publicar en Fargate. Solo desde main: un pull request no despliega.
  # ---------------------------------------------------------------------------
  desplegar:
    name: Desplegar en Fargate
    needs: construir
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El session token es obligatorio: las credenciales del Learner Lab son
      # temporales y sin el la llamada falla con InvalidClientTokenId.
      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # El runner es amd64, asi que el --platform linux/amd64 del script no
      # emula nada aqui: es gratis. En un Mac con Apple Silicon si hace falta, y
      # por eso esta en el script y no en el workflow.
      - name: Publicar
        run: ./scripts/publicar-fargate.sh
        env:
          AWS_REGION:     ${{ vars.AWS_REGION || 'us-east-1' }}
          ECR_REPO:       ${{ vars.ECR_REPO }}
          ECS_CLUSTER:    ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE:    ${{ vars.ECS_SERVICE }}
          API_ID:         ${{ vars.API_ID }}
          INTEGRATION_ID: ${{ vars.INTEGRATION_ID }}
